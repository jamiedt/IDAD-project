<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="style.css" />
    <script src="https://unpkg.com/tone@next/build/Tone.js"></script>
    <script src="script.js" defer></script>
    <title>Document</title>
  </head>
  <body>
    <dialog id="intro-dialog">
      <p>hi there imma make some sounds</p>
      <button id="intro-dialog-close">close</button>
    </dialog>

    <dialog id="event-dialog">
      <form id="event-form">
        <h2 id="event-dialog-title">Add event</h2>
        <label>
          Event name
          <input
            class="box-input"
            id="event-name"
            name="name"
            type="text"
            required
          />
        </label>
        <label>
          Date
          <input
            class="box-input"
            id="event-date"
            name="date"
            type="date"
            required
          />
        </label>
        <label>
          Start time
          <input
            class="box-input"
            id="event-time"
            name="time"
            type="time"
            required
          />
        </label>

        <label>
          Finish time
          <input
            class="box-input"
            id="event-end-time"
            name="endTime"
            type="time"
            required
          />
        </label>
        <div class="slider-field">
          <label for="event-excitement">Excitement</label>
          <input
            class="slider"
            id="event-excitement"
            name="excitement"
            type="range"
            min="0"
            max="100"
            value="50"
          />
          <div class="slider-labels">
            <span>Boring</span><output id="excitement-value">50</output
            ><span>Exciting</span>
          </div>
        </div>
        <div class="slider-field">
          <label for="event-energy">Intensity</label>
          <input
            class="slider"
            id="event-energy"
            name="energy"
            type="range"
            min="0"
            max="100"
            value="50"
          />
          <div class="slider-labels">
            <span>Calm</span><output id="energy-value">50</output
            ><span>Intense</span>
          </div>
        </div>
        <div class="slider-field">
          <label for="event-social">Speed</label>
          <input
            class="slider"
            id="event-social"
            name="social"
            type="range"
            min="0"
            max="100"
            value="50"
          />
          <div class="slider-labels">
            <span>Fast</span><output id="social-value">50</output
            ><span>Slow</span>
          </div>
        </div>
        <div class="event-actions">
          <button id="event-delete" type="button" class="delete">Delete</button>
          <div>
            <button id="event-cancel" type="button">Cancel</button>
            <button type="submit">Save event</button>
          </div>
        </div>
      </form>
    </dialog>

    <div class="calendar">
      <div class="calendar-header">
        <button id="previous"><</button>

        <h1 id="month-year"></h1>
        <button id="play-calendar">Play Calendar</button>
        <button id="next">></button>
      </div>

      <div class="weekdays">
        <div>Sun</div>
        <div>Mon</div>
        <div>Tue</div>
        <div>Wed</div>
        <div>Thu</div>
        <div>Fri</div>
        <div>Sat</div>
      </div>
      <div class="days" id="days"></div>
    </div>

    <div id="play-screen" hidden>
      <button id="play-back" type="button">Back</button>
      <div id="pad-grid"></div>
    </div>
  </body>
</html>
